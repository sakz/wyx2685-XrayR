# XrayR 弱配置 VPS 内核调优
# 安装: cp 99-xrayr.conf /etc/sysctl.d/ && sysctl --system
# 数值面向 512MB~2GB 内存、高延迟跨国链路的代理节点，按业务量自行增减。

# 拥塞控制: BBR + fq 是高丢包/高延迟链路提升吞吐的第一杠杆
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# socket 缓冲区上限放开到 32MB，容纳高带宽×高 RTT 的带宽时延积
# (BDP 估算: 带宽(Mbps) × RTT(ms) / 8 / 1000 = 所需 KB，例: 200Mbps×250ms ≈ 6.2MB)
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 87380 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# UDP 缓冲(QUIC/WS 等)与上面保持一致量级
net.core.rmem_default = 262144
net.core.wmem_default = 262144

# 长连接空闲后不重新慢启动，代理的持久连接受益明显
net.ipv4.tcp_slow_start_after_idle = 0

# 限制每连接内核发送缓冲中未发送数据量，降低高并发内存占用
net.ipv4.tcp_notsent_lowat = 131072

# ICMP 黑洞路径探测
net.ipv4.tcp_mtu_probing = 1

# 连接队列，高建连速率场景放开
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.tcp_max_tw_buckets = 1048576
net.ipv4.ip_local_port_range = 1024 65535

# 连接复用与 TIME_WAIT 快速回收
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_tw_reuse = 1

# 连接保活更早发现死连接，释放 fd 和内存
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 3

# 文件描述符由 systemd LimitNOFILE 或 /etc/security/limits.conf 设置，此处管不到
